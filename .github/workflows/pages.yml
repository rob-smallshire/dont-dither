name: Pages

# Build the project's GitHub Pages site -- the landing page and the articles,
# with a PDF of each article -- and deploy it. The site is built by
# tools/dontdither/site.py from docs/site/, docs/articles/ and the images
# they use in docs/images/; ubuntu runners have Chrome, which prints the PDFs.
# The repository's Pages source must be set to "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - docs/site/**
      - docs/articles/**
      - docs/images/**
      - tools/dontdither/site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but a
# deployment in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Build the site
        run: uv run --locked --no-default-groups --with "markdown>=3.5" dd-build-site

      - name: Check the PDFs were printed
        run: ls build/site/articles/*.pdf

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
