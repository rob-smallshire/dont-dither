[project]
name = "dont-dither"
version = "0.1.0"
description = "Don't Dither! -- a territory game for the BBC Micro Model B"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.5.3",
    "Pillow>=10",
]

[project.scripts]
dd-build = "dontdither.build:main"
dd-solve-patterns = "dontdither.solve_patterns:main"
dd-preview-sprites = "dontdither.preview_sprites:main"
dd-preview-splats = "dontdither.preview_splats:main"
dd-render-music = "dontdither.splash_theme:main"
dd-preview-levels = "dontdither.preview_levels:main"
dd-preview-ink-graph = "dontdither.preview_ink_graph:main"

[dependency-groups]
test = [
    "beebium[imaging]",
    "beebium-server",
    "pytest>=8",
    "pytest-timeout>=2",
]
solver = [
    "ortools>=9.10",
]
dev = [
    { include-group = "test" },
]

# Resolve from public PyPI, whatever the machine's default index, so that
# uv.lock records public URLs and CI can install from it (as Beebium does).
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/dontdither"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
