[project]
name = "dont-dither"
version = "0.1.0"
description = "Don't Dither! -- a territory game for the BBC Micro Model B"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10",
]

[project.scripts]
dd-build = "dontdither.build:main"
dd-solve-patterns = "dontdither.solve_patterns:main"
dd-preview-sprites = "dontdither.preview_sprites:main"

[dependency-groups]
test = [
    "beebium[imaging]",
    "beebium-server",
    "pytest>=8",
    "pytest-timeout>=2",
]
solver = [
    "ortools>=9.10",
]
dev = [
    { include-group = "test" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/dontdither"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
